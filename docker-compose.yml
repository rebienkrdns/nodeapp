services:

  install:
    build: ./app
    working_dir: /usr/src/app
    volumes:
      - ./app:/usr/src/app
    command: sh -c "rm -rf node_modules && bun install"
    user: "${CURRENT_UID}:${CURRENT_GID}"
    profiles: [ "install" ]

  dev:
    build: ./app
    working_dir: /usr/src/app
    volumes:
      - ./app:/usr/src/app
    command: bun run dev
    ports:
      - "3333:3333"
    user: "${CURRENT_UID}:${CURRENT_GID}"
    profiles: [ "dev" ]

  build:
    build: ./app
    working_dir: /usr/src/app
    volumes:
      - ./app:/usr/src/app
    command: bun run build
    user: "${CURRENT_UID}:${CURRENT_GID}"
    profiles: [ "build" ]

  run:
    build: ./app
    working_dir: /usr/src/app
    volumes:
      - ./app:/usr/src/app
    command: bun run start
    ports:
      - "3333:3333"
    user: "${CURRENT_UID}:${CURRENT_GID}"
    profiles: [ "run" ]
